x-postgres-service-environment: &postgres-service-environment
  OEFMS_DATASOURCE_USERNAME: ${OEFMS_DATASOURCE_USERNAME:-openefms}
  OEFMS_DATASOURCE_PASSWORD: ${OEFMS_DATASOURCE_PASSWORD:-openefms}
  OEFMS_DATASOURCE_DRIVER: org.postgresql.Driver
  OEFMS_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect

x-rabbitmq-service-environment: &rabbitmq-service-environment
  OEFMS_RABBITMQ_HOST: rabbitmq
  OEFMS_RABBITMQ_PORT: 5672
  OEFMS_RABBITMQ_USERNAME: ${OEFMS_RABBITMQ_USERNAME:-openefms}
  OEFMS_RABBITMQ_PASSWORD: ${OEFMS_RABBITMQ_PASSWORD:-openefms}
  OEFMS_RABBITMQ_VHOST: ${OEFMS_RABBITMQ_VHOST:-openefms}
  OEFMS_RABBITMQ_EXCHANGE: ${OEFMS_RABBITMQ_EXCHANGE:-oefms.events}
  OEFMS_RABBITMQ_DEAD_LETTER_EXCHANGE: ${OEFMS_RABBITMQ_DEAD_LETTER_EXCHANGE:-oefms.events.dlx}

x-postgres-rabbitmq-service-environment: &postgres-rabbitmq-service-environment
  <<: [*postgres-service-environment, *rabbitmq-service-environment]

services:
  postgres:
    image: postgres:16-alpine
    container_name: openefms-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${OEFMS_DATASOURCE_USERNAME:-openefms}
      POSTGRES_PASSWORD: ${OEFMS_DATASOURCE_PASSWORD:-openefms}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OEFMS_DATASOURCE_USERNAME:-openefms} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: openefms-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${OEFMS_RABBITMQ_USERNAME:-openefms}
      RABBITMQ_DEFAULT_PASS: ${OEFMS_RABBITMQ_PASSWORD:-openefms}
      RABBITMQ_DEFAULT_VHOST: ${OEFMS_RABBITMQ_VHOST:-openefms}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: openefms-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: openefms-api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - identity-service
      - administration-service
      - configuration-management-service
      - ingestion-management-service
      - fraud-detection-service
      - explainable-ai-service
      - rule-management-service
      - list-management-service
      - case-management-service
      - audit-logging-service
      - notification-management-service
      - report-management-service
      - gdpr-service

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: openefms-auth-service
    ports:
      - "8085:8085"
    environment:
      <<: *postgres-service-environment
      OEFMS_DATASOURCE_URL: jdbc:postgresql://postgres:5432/openefms_auth
      OEFMS_AUTH_ISSUER: ${OEFMS_AUTH_ISSUER:-http://localhost:8085}
      OEFMS_AUTH_BOOTSTRAP_USERNAME: ${OEFMS_AUTH_BOOTSTRAP_USERNAME:-oefms-admin}
      OEFMS_AUTH_BOOTSTRAP_PASSWORD: ${OEFMS_AUTH_BOOTSTRAP_PASSWORD:-openefms-admin}
      OEFMS_AUTH_BOOTSTRAP_ROLES: ${OEFMS_AUTH_BOOTSTRAP_ROLES:-PLATFORM_ADMIN,FRAUD_ANALYST}
      OEFMS_AUTH_BOOTSTRAP_PERMISSIONS: ${OEFMS_AUTH_BOOTSTRAP_PERMISSIONS:-oefms.read,oefms.write,fraud.decision.read,fraud.case.write}
      OEFMS_AUTH_CLIENT_ID: ${OEFMS_AUTH_CLIENT_ID:-oefms-platform}
      OEFMS_AUTH_CLIENT_SECRET: ${OEFMS_AUTH_CLIENT_SECRET:-openefms-platform-secret}
      OEFMS_AUTH_CLIENT_NAME: ${OEFMS_AUTH_CLIENT_NAME:-OEFMS Platform Client}
      OEFMS_AUTH_CLIENT_REDIRECT_URIS: ${OEFMS_AUTH_CLIENT_REDIRECT_URIS:-http://127.0.0.1:8080/login/oauth2/code/oefms-platform}
      OEFMS_AUTH_CLIENT_POST_LOGOUT_REDIRECT_URIS: ${OEFMS_AUTH_CLIENT_POST_LOGOUT_REDIRECT_URIS:-http://127.0.0.1:8080/}
      OEFMS_AUTH_CLIENT_SCOPES: ${OEFMS_AUTH_CLIENT_SCOPES:-openid,profile,oefms.read,oefms.write,fraud.decision.read,fraud.case.write}
      OEFMS_AUTH_CLIENT_ACCESS_TOKEN_TTL: ${OEFMS_AUTH_CLIENT_ACCESS_TOKEN_TTL:-PT15M}
      OEFMS_AUTH_CLIENT_REFRESH_TOKEN_TTL: ${OEFMS_AUTH_CLIENT_REFRESH_TOKEN_TTL:-PT8H}
      OEFMS_AUTH_CLIENT_REQUIRE_PROOF_KEY: ${OEFMS_AUTH_CLIENT_REQUIRE_PROOF_KEY:-true}
      OEFMS_AUTH_CLIENT_REQUIRE_AUTHORIZATION_CONSENT: ${OEFMS_AUTH_CLIENT_REQUIRE_AUTHORIZATION_CONSENT:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    container_name: openefms-identity-service
    ports:
      - "8087:8087"
    depends_on:
      postgres:
        condition: service_healthy

  administration-service:
    build:
      context: .
      dockerfile: services/administration-service/Dockerfile
    container_name: openefms-administration-service
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy

  configuration-management-service:
    build:
      context: .
      dockerfile: services/configuration-management-service/Dockerfile
    container_name: openefms-configuration-management-service
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy

  ingestion-management-service:
    build:
      context: .
      dockerfile: services/ingestion-management-service/Dockerfile
    container_name: openefms-ingestion-management-service
    ports:
      - "8089:8089"
    environment:
      <<: *rabbitmq-service-environment
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  fraud-detection-service:
    build:
      context: .
      dockerfile: services/fraud-detection-service/Dockerfile
    container_name: openefms-fraud-detection-service
    ports:
      - "8081:8081"
    environment:
      <<: *postgres-rabbitmq-service-environment
      OEFMS_DATASOURCE_URL: jdbc:postgresql://postgres:5432/openefms_fraud
      OEFMS_FRAUD_DECISION_MODE: ${OEFMS_FRAUD_DECISION_MODE:-rules}
      OEFMS_FRAUD_RULE_HIGH_VALUE_AMOUNT_THRESHOLD: ${OEFMS_FRAUD_RULE_HIGH_VALUE_AMOUNT_THRESHOLD:-10000.00}
      OEFMS_FRAUD_RULE_CRITICAL_VALUE_AMOUNT_THRESHOLD: ${OEFMS_FRAUD_RULE_CRITICAL_VALUE_AMOUNT_THRESHOLD:-100000.00}
      OEFMS_FRAUD_RULE_VELOCITY_REVIEW_COUNT: ${OEFMS_FRAUD_RULE_VELOCITY_REVIEW_COUNT:-5}
      OEFMS_FRAUD_RULE_VELOCITY_BLOCK_COUNT: ${OEFMS_FRAUD_RULE_VELOCITY_BLOCK_COUNT:-10}
      OEFMS_FRAUD_RULE_REVIEW_SCORE_THRESHOLD: ${OEFMS_FRAUD_RULE_REVIEW_SCORE_THRESHOLD:-0.35}
      OEFMS_FRAUD_RULE_BLOCK_SCORE_THRESHOLD: ${OEFMS_FRAUD_RULE_BLOCK_SCORE_THRESHOLD:-0.70}
      OEFMS_FRAUD_RULE_ESCALATE_SCORE_THRESHOLD: ${OEFMS_FRAUD_RULE_ESCALATE_SCORE_THRESHOLD:-0.90}
      OEFMS_FRAUD_ML_PROVIDER: ${OEFMS_FRAUD_ML_PROVIDER:-disabled}
      OEFMS_FRAUD_ML_MODEL_NAME: ${OEFMS_FRAUD_ML_MODEL_NAME:-xgboost-baseline}
      OEFMS_FRAUD_ML_SCORE_THRESHOLD: ${OEFMS_FRAUD_ML_SCORE_THRESHOLD:-0.80}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  explainable-ai-service:
    build:
      context: .
      dockerfile: services/explainable-ai-service/Dockerfile
    container_name: openefms-explainable-ai-service
    ports:
      - "8094:8094"
    environment:
      <<: *postgres-rabbitmq-service-environment
      OEFMS_DATASOURCE_URL: jdbc:postgresql://postgres:5432/openefms_explainable_ai
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  rule-management-service:
    build:
      context: .
      dockerfile: services/rule-management-service/Dockerfile
    container_name: openefms-rule-management-service
    ports:
      - "8082:8082"
    environment:
      <<: *postgres-service-environment
      OEFMS_DATASOURCE_URL: jdbc:postgresql://postgres:5432/openefms_rules
    depends_on:
      postgres:
        condition: service_healthy

  list-management-service:
    build:
      context: .
      dockerfile: services/list-management-service/Dockerfile
    container_name: openefms-list-management-service
    ports:
      - "8083:8083"
    environment:
      <<: *postgres-service-environment
      OEFMS_DATASOURCE_URL: jdbc:postgresql://postgres:5432/openefms_lists
    depends_on:
      postgres:
        condition: service_healthy

  case-management-service:
    build:
      context: .
      dockerfile: services/case-management-service/Dockerfile
    container_name: openefms-case-management-service
    ports:
      - "8084:8084"
    environment:
      <<: *postgres-rabbitmq-service-environment
      OEFMS_DATASOURCE_URL: jdbc:postgresql://postgres:5432/openefms_cases
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  audit-logging-service:
    build:
      context: .
      dockerfile: services/audit-logging-service/Dockerfile
    container_name: openefms-audit-logging-service
    ports:
      - "8090:8090"
    environment:
      <<: *rabbitmq-service-environment
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-management-service:
    build:
      context: .
      dockerfile: services/notification-management-service/Dockerfile
    container_name: openefms-notification-management-service
    ports:
      - "8091:8091"
    environment:
      <<: *rabbitmq-service-environment
    depends_on:
      rabbitmq:
        condition: service_healthy

  report-management-service:
    build:
      context: .
      dockerfile: services/report-management-service/Dockerfile
    container_name: openefms-report-management-service
    ports:
      - "8092:8092"
    depends_on:
      postgres:
        condition: service_healthy

  gdpr-service:
    build:
      context: .
      dockerfile: services/gdpr-service/Dockerfile
    container_name: openefms-gdpr-service
    ports:
      - "8093:8093"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
