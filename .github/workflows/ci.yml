name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn clean verify

      - name: Local smoke checks
        run: ./scripts/smoke-local.sh --skip-build

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web-console/package-lock.json

      - name: Build web console
        working-directory: apps/web-console
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
