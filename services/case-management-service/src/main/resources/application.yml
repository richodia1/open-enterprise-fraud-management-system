spring:
  application:
    name: case-management-service
  datasource:
    url: "${OEFMS_DATASOURCE_URL:jdbc:postgresql://localhost:5432/openefms_cases}"
    username: "${OEFMS_DATASOURCE_USERNAME:openefms}"
    password: "${OEFMS_DATASOURCE_PASSWORD:openefms}"
    driver-class-name: "${OEFMS_DATASOURCE_DRIVER:org.postgresql.Driver}"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: "${OEFMS_JPA_DDL_AUTO:none}"
    properties:
      hibernate:
        dialect: "${OEFMS_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}"
  flyway:
    enabled: "${OEFMS_FLYWAY_ENABLED:true}"
    locations: "${OEFMS_FLYWAY_LOCATIONS:classpath:db/migration/common,classpath:db/migration/postgresql}"
  rabbitmq:
    host: "${OEFMS_RABBITMQ_HOST:localhost}"
    port: "${OEFMS_RABBITMQ_PORT:5672}"
    username: "${OEFMS_RABBITMQ_USERNAME:openefms}"
    password: "${OEFMS_RABBITMQ_PASSWORD:openefms}"
    virtual-host: "${OEFMS_RABBITMQ_VHOST:openefms}"
    listener:
      simple:
        default-requeue-rejected: "${OEFMS_RABBITMQ_DEFAULT_REQUEUE_REJECTED:false}"
  kafka:
    bootstrap-servers: "${OEFMS_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}"
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info

oefms:
  event-transport: "${OEFMS_EVENT_TRANSPORT:rabbitmq}"
  kafka:
    consumer-groups:
      case-management: "${OEFMS_KAFKA_CASE_CONSUMER_GROUP:oefms.case-management}"
  case-management:
    configuration:
      base-url: "${OEFMS_CASE_CONFIGURATION_SERVICE_URL:http://localhost:8088}"
      assignment-policy-resource-type: "${OEFMS_CASE_ASSIGNMENT_POLICY_RESOURCE_TYPE:CASE_ASSIGNMENT_POLICIES}"
      request-timeout: "${OEFMS_CASE_CONFIGURATION_REQUEST_TIMEOUT:PT5S}"
      enabled: "${OEFMS_CASE_CONFIGURATION_ENABLED:true}"
      require-policy: "${OEFMS_CASE_REQUIRE_ASSIGNMENT_POLICY:false}"
      fallback-assignment-roles: "${OEFMS_CASE_FALLBACK_ASSIGNMENT_ROLES:FRAUD_ANALYST,FRAUD_SUPERVISOR}"
      fallback-escalation-roles: "${OEFMS_CASE_FALLBACK_ESCALATION_ROLES:FRAUD_SUPERVISOR,FRAUD_ESCALATION_REVIEWER,COMPLIANCE_OFFICER}"
    identity:
      base-url: "${OEFMS_CASE_IDENTITY_SERVICE_URL:http://localhost:8087}"
      user-resource-type: "${OEFMS_CASE_IDENTITY_USER_RESOURCE_TYPE:CUSTOM_USERS}"
      request-timeout: "${OEFMS_CASE_IDENTITY_REQUEST_TIMEOUT:PT5S}"
      validate-assignees: "${OEFMS_CASE_VALIDATE_ASSIGNEES:true}"
  rabbitmq:
    exchange: "${OEFMS_RABBITMQ_EXCHANGE:oefms.events}"
    dead-letter-exchange: "${OEFMS_RABBITMQ_DEAD_LETTER_EXCHANGE:oefms.events.dlx}"
